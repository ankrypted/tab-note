<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tab Note</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main id="note-view" class="view">
      <header class="page-header">
        <div id="favicon" class="favicon" aria-hidden="true"></div>
        <div class="page-meta">
          <div id="page-title" class="page-title"></div>
          <div id="page-url" class="page-url"></div>
        </div>
        <div id="status" class="status" aria-live="polite" hidden>
          <span class="dot"></span><span id="status-text">Saved</span>
        </div>
        <button
          id="expand"
          class="btn-icon header-btn"
          type="button"
          aria-label="Open in side panel"
          title="Open in side panel"
          hidden
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect x="3" y="4" width="18" height="16" rx="2" />
            <path d="M15 4v16" />
          </svg>
        </button>
        <button
          id="collapse"
          class="btn-icon header-btn"
          type="button"
          aria-label="Back to popup"
          title="Back to popup"
          hidden
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7" />
          </svg>
        </button>
      </header>

      <div class="editor">
        <label for="note" class="visually-hidden">Note for this page</label>
        <textarea
          id="note"
          maxlength="100000"
          placeholder="Jot something down about this tab. It saves on its own."
        ></textarea>
        <p id="unsupported" class="unsupported" hidden>Couldn't find the current tab.</p>
      </div>

      <p id="hint" class="hint" aria-live="polite"></p>

      <footer id="footer" class="footer">
        <button id="open-list" class="btn-primary" type="button">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M4 6h16M4 12h16M4 18h10" />
          </svg>
          <span id="list-label">Tab notes</span>
        </button>
        <div id="count" class="count"></div>
        <button
          id="save-file"
          class="btn-icon"
          type="button"
          aria-label="Save note to a file"
          title="Save to file"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M12 4v11M7 11l5 5 5-5M5 20h14" />
          </svg>
        </button>
        <div id="delete-area" class="delete-area">
          <button id="delete" class="btn-icon danger" type="button" aria-label="Delete note">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v5M14 11v5" />
            </svg>
          </button>
          <div id="confirm" class="confirm" hidden>
            <span>Delete note?</span>
            <button id="confirm-yes" class="btn-danger" type="button">Delete</button>
            <button id="confirm-no" class="btn-quiet" type="button">Cancel</button>
          </div>
        </div>
      </footer>
    </main>

    <section id="list-view" class="view" hidden>
      <header class="list-header">
        <button id="back" class="btn-icon" type="button" aria-label="Back to this page's note">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M15 18l-6-6 6-6" />
          </svg>
        </button>
        <h1>Tabs with notes</h1>
        <div id="list-count" class="count"></div>
      </header>
      <ul id="list" class="list"></ul>
      <p id="list-empty" class="empty" hidden>
        No notes yet. Type in any tab and it shows up here until the tab closes.
      </p>
    </section>

    <script type="module" src="popup.js"></script>
  </body>
</html>
