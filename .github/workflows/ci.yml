name: CI

on:
  push:
    branches: [master]
  pull_request:

# Cancel an older run of the same branch when a newer push arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # `npm ci` installs exactly what package-lock.json says (no surprises).
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Formatting
        run: npm run format:check

      - name: Unit tests with coverage (fails under 90%)
        run: npm run test:coverage

      - name: Build and package
        run: npm run package

      - name: Upload the installable zip
        uses: actions/upload-artifact@v4
        with:
          name: tab-note-extension
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
